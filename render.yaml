services:
  - type: web
    name: my-app
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ID
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: VITE_KIMI_AUTH_URL
        sync: false
      - key: VITE_APP_ID
        sync: false
      - key: KIMI_AUTH_URL
        sync: false
      - key: KIMI_OPEN_URL
        sync: false
      - key: OWNER_UNION_ID
        sync: false
